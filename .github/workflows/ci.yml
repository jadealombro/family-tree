name: CI

# Run on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow may only read the repository.
permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-plugin/family-tree
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check coding standards
        run: composer lint

      - name: Run unit tests
        run: composer test
